name: Publish preview

# A push to preview rebuilds the Pages site from main (which also builds preview into /preview/);
# only main may deploy to the github-pages environment.
on:
  push:
    branches: [preview]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Pages deployment on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
